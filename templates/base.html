<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sharons{% endblock %}</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f7f8fa; color: #20242a; }
    header { background: #20242a; color: white; padding: 16px 24px; }
    main { max-width: 1120px; margin: 0 auto; padding: 24px; }
    a { color: #1f5fa8; }
    table { width: 100%; border-collapse: collapse; background: white; }
    th, td { border-bottom: 1px solid #dde2e8; padding: 10px; text-align: left; vertical-align: top; }
    th { background: #eef1f5; font-size: 14px; }
    .panel { background: white; border: 1px solid #dde2e8; border-radius: 6px; padding: 16px; margin-bottom: 16px; }
    .meta { color: #5a6470; font-size: 14px; }
    .error { border: 1px solid #b42318; background: #fff3f0; color: #7a271a; padding: 12px; border-radius: 6px; }
    label { display: block; font-weight: bold; margin-top: 12px; }
    textarea, input[type="number"] { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #bbc3cc; border-radius: 4px; }
    select, input[type="text"], input:not([type]) { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #bbc3cc; border-radius: 4px; }
    textarea { min-height: 140px; font-family: Consolas, monospace; }
    button { border: 0; border-radius: 4px; padding: 10px 14px; background: #1f5fa8; color: white; cursor: pointer; }
    .status { font-weight: bold; }
    .metric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .metric { background: white; border: 1px solid #dde2e8; border-radius: 6px; padding: 14px; }
    a.metric { display: block; color: inherit; text-decoration: none; }
    .metric span { display: block; font-size: 28px; font-weight: bold; margin-bottom: 4px; }
    .metric strong { color: #5a6470; font-size: 13px; text-transform: uppercase; }
    .details { display: grid; grid-template-columns: 180px 1fr; gap: 8px 16px; }
    .details dt { color: #5a6470; font-weight: bold; }
    .details dd { margin: 0; }
  </style>
</head>
<body>
  <header>
    <strong>Sharons Chief of Staff</strong>
  </header>
  <main>
    {% if messages %}
      {% for message in messages %}
        <div class="{{ message.tags|default:'panel' }}">{{ message }}</div>
      {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
