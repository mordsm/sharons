services:
  postgres:
    image: postgres:16-alpine
    container_name: sharons-postgres
    environment:
      POSTGRES_DB: sharons_dev
      POSTGRES_USER: sharons
      POSTGRES_PASSWORD: sharons_dev_password
    ports:
      - "127.0.0.1::5432"
    volumes:
      - sharons_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sharons -d sharons_dev"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  sharons_postgres_data:
